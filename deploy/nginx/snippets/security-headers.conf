# 部署时按需 include 到 server 块里。
#
# 为什么单独拆一个 snippet：nginx 的 add_header 有个反直觉的继承规则——
# 只要当前层出现任意一条 add_header，就完全不再继承上一层的 add_header。
# 所以 /api/ 里要加 `X-Accel-Buffering: no`（SSE 兜底）时，如果安全响应头只写在
# server 层，/api/ 下这些头会全部消失。用 include 让每个 location 都拿到同一份。

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 这套应用不引第三方脚本，CSP 可以收得很紧；connect-src 允许同源，
# 因为前端走相对路径打 /api，由 nginx 转发到后端
add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

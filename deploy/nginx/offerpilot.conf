# OfferPilot 生产配置
#
# 部署时需要改的地方只有两处，都在下文标了 <<< 改成你的域名。
#
# 结构：
#   80  → 跳转 443，另开 ACME 校验路径
#   443 → /api/  转后端（含 SSE），其余转前端
#
# 前后端走同一个域名同一条链路，所以浏览器不触发 CORS 预检，
# SSE 也不用操心跨域连接被浏览器掐断。

upstream offerpilot_api {
    server backend:18088;
    # SSE 一轮要 9-11s，连接可能挂一会儿，给足 keepalive
    keepalive 32;
}

upstream offerpilot_web {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name offerpilot.example.com;   # <<< 改成你的域名

    # Let's Encrypt 续期用。删掉这条跳转，续期会失败
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name offerpilot.example.com;   # <<< 改成你的域名

    ssl_certificate     /etc/letsencrypt/live/offerpilot.example.com/fullchain.pem;  # <<<
    ssl_certificate_key /etc/letsencrypt/live/offerpilot.example.com/privkey.pem;    # <<<

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # OCSP stapling 需要一份可信根证书来验签，nginx 镜像里自带这份
    ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    ssl_stapling on;
    ssl_stapling_verify on;

    # 上传 JD / 简历的地方，留够
    client_max_body_size 5m;

    include /etc/nginx/snippets/security-headers.conf;

    # ---------- API（含 SSE）----------
    location /api/ {
        # 结尾不能带 "/"，带了会把 /api 前缀从转发出去的 URI 里截掉
        proxy_pass http://offerpilot_api;

        proxy_http_version 1.1;
        # 置空而不是 "close"：后端是长连接，空值才不会干扰上游 keepalive
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- 以下是 SSE 能用的关键，配置错了流式会被攒成一次性返回 ----
        # 不缓冲：收到一段转发一段
        proxy_buffering off;
        proxy_cache off;
        # 单轮评估+提问要十几秒，默认 60s 会先掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # gzip 会把事件攒在压缩缓冲区里等凑够，实时性直接没了
        gzip off;
        # 兜底：后端其实也发了这个头，两边都压一道
        add_header X-Accel-Buffering no;
    }

    # 健康检查直接给后端，不记访问日志
    location = /health {
        proxy_pass http://offerpilot_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------- 前端 ----------
    location / {
        proxy_pass http://offerpilot_web;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;   # HMR 走开发模式，生产用不到但留着无害
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 这里要开缓冲：HTML/JS 压缩后再发更划算，和 /api/ 正好相反
        proxy_buffering on;

        # 静态资源带 hash，可以长期缓存
        location /_next/static/ {
            proxy_pass http://offerpilot_web;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
